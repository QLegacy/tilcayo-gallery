<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6750a4">
  <title>Галерея Тилькайо</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-bar">
    <div>
      <h1>Тилькайо</h1>
      <p id="count" class="subtitle"></p>
    </div>
    <button class="btn tonal" id="shuffle" type="button">Перемешать</button>
    <button class="btn tonal" id="admin" type="button">Предложка</button>
  </header>

  <main id="grid" class="grid"></main>
  <p id="empty" class="empty" hidden>Здесь пока пусто.</p>

  <button class="fab" id="fab" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    Добавить
  </button>

  <!-- Просмотр / карусель -->
  <dialog id="viewer" class="sheet viewer">
    <div class="stage" id="stage">
      <img id="viewer-img" alt="" draggable="false">
      <button class="nav prev" id="prev" type="button" aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.800 12z"/></svg>
      </button>
      <button class="nav next" id="next" type="button" aria-label="Вперёд">
        <svg viewBox="0 0 24 24"><path d="m8.6 16.6 4.6-4.6-4.600-4.600L10 6l6 6-6 6z"/></svg>
      </button>
    </div>
    <div class="viewer-text">
      <h2 id="viewer-title"></h2>
      <p id="viewer-desc"></p>
    </div>
    <div class="viewer-bar">
      <a id="credit" class="chip" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        <span id="credit-text"></span>
      </a>
      <span id="counter" class="counter"></span>
      <button class="btn text" id="viewer-close" type="button">Закрыть</button>
    </div>
  </dialog>

  <!-- Загрузка -->
  <dialog id="uploader" class="sheet dialog">
    <form id="form" novalidate>
      <h2>Новый мем</h2>
      <p class="hint">Укажи, кто его сделал: автор покажется при открытии картинки.</p>

      <label class="drop" id="drop" tabindex="0">
        <input type="file" id="file" name="image" accept="image/*" hidden>
        <img id="preview" alt="" hidden>
        <span id="drop-text">Выбрать картинку</span>
      </label>

      <div class="field plain">
        <input id="title" name="title" placeholder=" " autocomplete="off" maxlength="60">
        <label for="title">Название мема</label>
        <small id="title-help">Обязательно, до 60 символов</small>
      </div>

      <div class="field plain">
        <textarea id="description" name="description" placeholder=" " rows="3" maxlength="300"></textarea>
        <label for="description">Описание</label>
        <small>Необязательно, до 300 символов</small>
      </div>

      <div class="field plain">
        <input id="author" name="author" placeholder=" " autocomplete="off"
               autocapitalize="none" spellcheck="false" maxlength="200">
        <label for="author">Автор в Telegram</label>
        <small id="author-help">@юзернейм, ссылка на профиль или канал, либо tg://user?id=…</small>
      </div>

      <div class="actions">
        <button class="btn text" id="cancel" type="button">Отмена</button>
        <button class="btn filled" id="submit" type="submit">Опубликовать</button>
      </div>
    </form>
  </dialog>

  <div id="snackbar" class="snackbar" role="status"></div>
  <script src="script.js"></script>
  <!-- Admin button -->
  <script>document.getElementById('admin').addEventListener('click', function() {
  window.location.href = 'https://t.me/mistercatnap';
  });
  </script>
</body>
</html>
